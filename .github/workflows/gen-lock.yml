name: gen-lock

# 一次性工具,用完就删。
#
# 为什么需要它:`package-lock.json` 在 Windows 上生成时,写不进 Linux 需要的
# 那几个可选依赖(`@emnapi/*`,`@tailwindcss/oxide-wasm32-wasi` 带进来的),
# 于是 `npm ci` 在 CI 上必然失败,而本地永远复现不了 —— 开发机是 Windows。
#
# 开发机没有 Docker,起不了 Linux 容器,所以借这台 runner 生成一份 Linux 的 lock。
on: workflow_dispatch

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 在 Linux 上重新解析出一份 lock
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: 顺便确认 npm ci 收得下它
        run: |
          rm -rf node_modules
          npm ci

      - uses: actions/upload-artifact@v4
        with:
          name: lock
          path: package-lock.json
          if-no-files-found: error
